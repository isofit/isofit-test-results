name: Lake Mary Single Pixel

on:
  workflow_call:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Extras
        id: cache-extras
        uses: actions/cache@v5
        with:
          path: ~/.isofit
          key: extras-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.25"
          python-version: "3.12"
          activate-environment: true

      - name: Install ISOFIT
        run: |
          uv pip install "isofit[plots] @ git+https://github.com/isofit/isofit@dev"

      - name: Execute tests
        run: |
          mkdir results

          RUN=$(isofit path examples)/LakeMary/

          for i in default bgrfl; do
            $RUN/${i}.sh --log_file results/${i}.log --resources
            isoplots spfit -p $RUN -o results/${i}.png
            isoplots resources results/${i}.resources.jsonl -o results/${i}.resources.html -l results/${i}.log --relative --png --debug
          done

      - uses: actions/upload-artifact@v6
        with:
          name: lake_mary
          path: results
